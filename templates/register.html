{% extends 'base.html' %}
{% block title %}Registrar - FlashCard App{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header bg-success text-white">Criar Conta</div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ email or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Idioma nativo</label>
            <input type="text" class="form-control" name="native_language" value="{{ native_language or '' }}">
          </div>
          <button type="submit" class="btn btn-success">Registrar</button>
          <a href="{{ url_for('login') }}" class="btn btn-link">Já tenho conta</a>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
