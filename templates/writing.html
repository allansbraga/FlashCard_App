{% extends 'base.html' %}
{% block title %}Writing - FlashCard App{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header bg-warning text-dark">Writing</div>
  <div class="card-body">
    <p>Escreva um texto curto. Será avaliado e somado ao seu progresso.</p>
    <textarea id="writingText" class="form-control" rows="6" placeholder="Digite seu texto"></textarea>
    <button id="writingSubmit" class="btn btn-warning mt-2">Avaliar</button>
    <div id="writingResult" class="mt-2"></div>
  </div>
{% endblock %}
{% block extra_js %}
<script>
document.getElementById('writingSubmit').addEventListener('click', function(){
  const text = document.getElementById('writingText').value;
  const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
  fetch('{{ url_for("writing_check") }}', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'text='+encodeURIComponent(text)+'&csrf_token='+encodeURIComponent(token)})
    .then(r=>r.json()).then(data=>{
      document.getElementById('writingResult').textContent = 'Score: '+data.score+' | Erros: '+data.errors;
    });
});
</script>
{% endblock %}
